<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Structured Query</title>
<meta name="description" content="An information technology and software development consultancy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --accent: #1F5FAD; --ink: #16181D; --muted: #4A4E57; --ground: #F7F7F5; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; background: var(--ground); color: var(--ink); font-family: "IBM Plex Sans", system-ui, sans-serif; }
  main { width: 100%; max-width: 1120px; margin: 0 auto; padding: 96px 24px; display: flex; flex-direction: column; justify-content: center; gap: 32px; }
  .mono { font-family: "IBM Plex Mono", monospace; }
  .queries { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; font-size: 14px; letter-spacing: 0.02em; }
  .queries div { display: flex; align-items: center; gap: 10px; }
  .q-sql { color: var(--accent); }
  .q-sql .prompt { width: 16px; text-align: center; opacity: 0.6; }
  .q-ai { color: var(--muted); }
  .q-ai svg { flex: 0 0 auto; }
  .title { display: flex; align-items: center; flex-wrap: wrap; gap: 20px 28px; }
  .title img { width: clamp(3.5rem, 8vw, 6.5rem); height: auto; display: block; mix-blend-mode: multiply; }
  h1 { margin: 0; font-size: clamp(2.75rem, 7vw, 5.5rem); line-height: 1.02; font-weight: 600; letter-spacing: -0.035em; }
  p { margin: 0; font-size: clamp(1.125rem, 2vw, 1.5rem); line-height: 1.45; color: var(--muted); max-width: 34ch; }
  .contact { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px; margin-top: 8px; }
  .btn { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 22px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 16px; font-weight: 500; text-decoration: none; }
  .btn:hover { background: #184C8A; }
  .email { font-size: 15px; color: var(--muted); }
  .email:hover { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="queries mono">
    <div class="q-sql"><span class="prompt" aria-hidden="true">&gt;</span><span>select top 1 * from consultancy;</span></div>
    <div class="q-ai">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6.3 6.3l2.5 2.5M15.2 15.2l2.5 2.5M6.3 17.7l2.5-2.5M15.2 8.8l2.5-2.5"/></svg>
      <span>Find me the best consultancy and engage them.</span>
    </div>
  </div>
  <div class="title">
    <img src="img/structured-query-logo.png" alt="Structured Query logo" width="104" height="104">
    <h1>Structured Query</h1>
  </div>
  <p>An information technology and software development consultancy.</p>
  <div class="contact">
    <a class="btn" href="mailto:ron@structuredquery.com">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
      Get in touch
    </a>
    <a class="email mono" href="mailto:ron@structuredquery.com">ron@structuredquery.com</a>
  </div>
</main>
</body>
</html>
